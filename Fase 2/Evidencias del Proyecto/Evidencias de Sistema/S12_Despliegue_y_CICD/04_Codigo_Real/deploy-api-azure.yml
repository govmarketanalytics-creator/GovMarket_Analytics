name: Build and deploy GovMarket Analytics to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar API
        run: npm run lint --workspace=apps/api

      - name: Compilar API
        run: npm run build --workspace=apps/api

      - name: Compilar web
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build --workspace=apps/web

      - name: Verificar archivos compilados
        run: |
          test -f apps/api/dist/main.js
          test -f apps/web/dist/index.html

      - name: Preparar artefacto
        run: rm -rf node_modules apps/api/node_modules apps/web/node_modules

      - name: Guardar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: govmarket-app
          path: .
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: govmarket-app

      - name: Iniciar sesión en Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Desplegar en Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: api-govmarket-dev-2601
          slot-name: Production
          package: .